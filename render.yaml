services:
  - type: web
    name: leonilda-bob
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-server-header --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /readyz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        value: https://leonildabob.onrender.com
      - key: ALLOWED_HOSTS
        value: leonildabob.onrender.com
      - key: COOKIE_SECURE
        value: "1"
      - key: DOCS_ENABLED
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://qagpnekyitrlsgsirrpm.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: whatsapp-media
      - key: ADMIN_USERNAME
        value: leonilda bob
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: METRICS_SALT
        generateValue: true
      - key: WHATSAPP_PROVIDER
        value: qr
      - key: WHATSAPP_DRY_RUN
        value: "0"
      - key: WHATSAPP_QR_BRIDGE_URL
        value: https://leonilda-bob-qr-bridge.onrender.com
      - key: WHATSAPP_QR_BRIDGE_TOKEN
        sync: false
      - key: WHATSAPP_QR_BRIDGE_AUTOSTART
        value: "0"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_FIRST_CONTACT_TEMPLATE
        sync: false
      - key: META_GRAPH_VERSION
        sync: false

  - type: web
    name: leonilda-bob-qr-bridge
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.whatsapp-qr
    healthCheckPath: /healthz
    envVars:
      - key: WHATSAPP_QR_BRIDGE_HOST
        value: "0.0.0.0"
      - key: WHATSAPP_QR_BRIDGE_TOKEN
        sync: false
      - key: WHATSAPP_QR_INBOUND_URL
        value: https://leonildabob.onrender.com/api/webhooks/whatsapp/qr
      - key: WHATSAPP_QR_AUTH_DIR
        value: /app/.whatsapp-qr-auth/default

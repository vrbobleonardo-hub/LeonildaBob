services:
  - type: web
    name: leonilda-bob
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt && npm install
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-server-header --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /readyz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        value: https://bobadvogados.com.br
      - key: ALLOWED_HOSTS
        value: bobadvogados.com.br,leonildabob.onrender.com,127.0.0.1,localhost
      - key: COOKIE_SECURE
        value: "1"
      - key: DOCS_ENABLED
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://qagpnekyitrlsgsirrpm.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: whatsapp-media
      - key: ADMIN_USERNAME
        value: leonilda bob
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: METRICS_SALT
        generateValue: true
      - key: WHATSAPP_PROVIDER
        value: evolution
      - key: WHATSAPP_DRY_RUN
        value: "0"
      - key: WHATSAPP_AUTO_REPLY
        value: "0"
      - key: WHATSAPP_OUTBOX_MIN_INTERVAL_SECONDS
        value: "12"
      - key: WHATSAPP_QR_BRIDGE_TOKEN
        sync: false
      - key: WHATSAPP_QR_BRIDGE_URL
        sync: false
      - key: WHATSAPP_QR_BRIDGE_AUTOSTART
        value: "0"
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_INTERNAL_HOSTPORT
        fromService:
          type: web
          name: leonilda-bob-whatsapp-qr
          property: hostport
      - key: EVOLUTION_API_KEY
        fromService:
          type: web
          name: leonilda-bob-whatsapp-qr
          envVarKey: AUTHENTICATION_API_KEY
      - key: EVOLUTION_INSTANCE
        value: bob-advogados
      - key: EVOLUTION_WEBHOOK_TOKEN
        generateValue: true
      - key: EVOLUTION_REQUEST_TIMEOUT_SECONDS
        value: "20"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_FIRST_CONTACT_TEMPLATE
        sync: false
      - key: META_GRAPH_VERSION
        sync: false

  - type: web
    name: leonilda-bob-whatsapp-qr
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./Dockerfile.evolution
    dockerContext: .
    healthCheckPath: /
    disk:
      name: whatsapp-qr-session
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SERVER_NAME
        value: bob-advogados-evolution
      - key: SERVER_TYPE
        value: http
      - key: TELEMETRY_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        value: https://bobadvogados.com.br
      - key: CORS_METHODS
        value: GET,POST,PUT,DELETE
      - key: CORS_CREDENTIALS
        value: "true"
      - key: LOG_LEVEL
        value: ERROR,WARN
      - key: LOG_COLOR
        value: "false"
      - key: LOG_BAILEYS
        value: error
      - key: DEL_INSTANCE
        value: "false"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromService:
          type: web
          name: leonilda-bob
          envVarKey: DATABASE_URL
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: bob_advogados_evolution
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "true"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "true"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "true"
      - key: DATABASE_SAVE_DATA_LABELS
        value: "false"
      - key: DATABASE_SAVE_DATA_HISTORIC
        value: "false"
      - key: DATABASE_SAVE_IS_ON_WHATSAPP
        value: "false"
      - key: DATABASE_DELETE_MESSAGE
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
        value: "false"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: Bob Advogados
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: LANGUAGE
        value: pt-BR
